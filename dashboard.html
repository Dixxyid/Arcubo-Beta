<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Navigation - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ==========================================================================
           CSS UTAMA & GLASSMORPHISM
           ========================================================================== */
        :root {
            --bg-gradient: linear-gradient(135deg, #020510 0%, #080f26 50%, #010206 100%);
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: #a4b0be;
            --glow-cyan: #00d2d3;
            --glow-blue: #00a8ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .header h1 span {
            background: linear-gradient(to right, var(--glow-cyan), var(--glow-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* Menu Buttons Style */
        .menu-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #0056b3 0%, #00a8ff 100%);
            border: none;
            border-radius: 16px;
            padding: 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 168, 255, 0.3);
            transition: all 0.2s ease;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 168, 255, 0.5);
        }

        .icon-main { font-size: 1.8rem; }
        .btn-text-main { text-align: left; }
        .btn-text-main .title { display: block; font-weight: 800; font-size: 1rem; letter-spacing: 1px; }
        .btn-text-main .subtitle { font-size: 0.75rem; opacity: 0.8; }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .btn-sub {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-sub:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--glow-blue);
        }

        .icon-small { font-size: 1.2rem; }
        .btn-content { text-align: left; display: flex; flex-direction: column; }
        .txt-id { font-size: 0.85rem; font-weight: 600; }
        .txt-en { font-size: 0.7rem; color: var(--text-secondary); }

        /* AREA STATISTIK RATING & GLOWING STARS */
        .rating-stats {
            text-align: center;
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .rating-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .score-value {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #00d2d3, #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 168, 255, 0.4));
            line-height: 1.1;
        }

        .stars-static {
            position: relative;
            display: inline-block;
            font-size: 1.6rem;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.12);
            user-select: none;
        }

        .stars-active {
            position: absolute;
            top: 0;
            left: 0;
            color: #ffd700;
            overflow: hidden;
            white-space: nowrap;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.75)); 
        }

        .total-reviews {
            font-size: 0.75rem;
            color: #a4b0be;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* STYLING FOOTER COPYRIGHT */
        .footer-copyright {
            margin-top: 24px;
            text-align: center;
            font-size: 0.50rem;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .footer-copyright span {
            color: var(--glow-cyan);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <h1>AUGMENTED <span>REALITY</span></h1>
        <p>Jelajahi dunia digital dan pengalaman interaktif</p>
    </header>

    <div class="menu-wrapper">
        <button class="btn-main" onclick="navigateTo('starts.html')">
            <span class="icon-main">🚀</span>
            <div class="btn-text-main">
                <span class="title">MULAI SEKARANG</span>
                <span class="subtitle">Enter AR Camera Mode</span>
            </div>
        </button>

        <div class="btn-grid">
            <button class="btn-sub" onclick="navigateTo('guides.html')">
                <span class="icon-small">📖</span>
                <div class="btn-content">
                    <span class="txt-id">Panduan</span>
                    <span class="txt-en">Guide</span>
                </div>
            </button>

            <button class="btn-sub" onclick="navigateTo('markerbeta.html')">
                <span class="icon-small">🎯</span>
                <div class="btn-content">
                    <span class="txt-id">Marker</span>
                    <span class="txt-en">AR Marker</span>
                </div>
            </button>

            <button class="btn-sub" onclick="navigateTo('quiz.html')">
                <span class="icon-small">💡</span>
                <div class="btn-content">
                    <span class="txt-id">Kuis</span>
                    <span class="txt-en">Quiz</span>
                </div>
            </button>

            <button class="btn-sub" onclick="navigateTo('learning.html')">
                <span class="icon-small">📋</span>
                <div class="btn-content">
                    <span class="txt-id">Materi</span>
                    <span class="txt-en">Material</span>
                </div>
            </button>

            <button class="btn-sub" onclick="navigateTo('about.html')">
                <span class="icon-small">ℹ️</span>
                <div class="btn-content">
                    <span class="txt-id">Tentang</span>
                    <span class="txt-en">About Us</span>
                </div>
            </button>

            <button class="btn-sub" onclick="navigateTo('feedback.html')">
                <span class="icon-small">⭐</span>
                <div class="btn-content">
                    <span class="txt-id">Ulasan</span>
                    <span class="txt-en">Feedback</span>
                </div>
            </button>
        </div>

        <div class="rating-stats" id="ratingStats" style="display: none;">
            <div class="rating-score">
                <span id="avgRating" class="score-value">0.0</span>
                <div class="stars-static">
                    ★★★★★
                    <div id="starFill" class="stars-active" style="width: 0%;">★★★★★</div>
                </div>
            </div>
            <p id="reviewCount" class="total-reviews">Menghitung data transmisi...</p>
        </div>
    </div>
</div>

<!-- FOOTER COPYRIGHT DI BAGIAN PALING BAWAH -->
<footer class="footer-copyright">
    © 2026 <span>ARCUBO</span> - Universitas Lampung. All rights reserved.
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Konfigurasi Resmi Proyek arcubo-5ed55
    const firebaseConfig = {
        apiKey: "AIzaSyCY_j7-nitUEtMI4-Xk9vPj4UmSWvh1TVM",
        authDomain: "arcubo-5ed55.firebaseapp.com",
        projectId: "arcubo-5ed55",
        storageBucket: "arcubo-5ed55.firebasestorage.app",
        messagingSenderId: "788282131772",
        appId: "1:788282131772:web:bc13320122f8bb62544a39"
    };

    // Inisialisasi Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Fungsi Navigasi
    function navigateTo(url) {
        setTimeout(() => {
            window.location.href = url;
        }, 150); 
    }
    window.navigateTo = navigateTo;

    // Fungsi Mengambil Data Rating dan Kalkulasi Statistik
    async function loadRatingStats() {
        try {
            const querySnapshot = await getDocs(collection(db, "feedback"));
            const totalReviews = querySnapshot.size;

            if (totalReviews > 0) {
                let totalScore = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.rating) {
                        totalScore += data.rating;
                    }
                });

                const average = (totalScore / totalReviews).toFixed(1);
                const starPercentage = (average / 5) * 100;

                document.getElementById('avgRating').innerText = average;
                document.getElementById('reviewCount').innerText = `Berdasarkan ${totalReviews} Ulasan`;
                document.getElementById('starFill').style.width = `${starPercentage}%`;
                
                const ratingStatsEl = document.getElementById('ratingStats');
                if (ratingStatsEl) {
                    ratingStatsEl.style.display = 'block';
                }
            }
        } catch (err) {
            console.error('Gagal mengambil data dari Firebase:', err.message);
        }
    }

    window.addEventListener('DOMContentLoaded', loadRatingStats);
</script>

</body>
</html>
