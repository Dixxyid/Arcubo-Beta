<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Marker AR - WebAR Solar System</title>
    <!-- Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/markerbeta.css">
</head>
<body>

    <section class="marker-section">
        <div class="badge-header">Target Marker WebAR</div>
        <h1 class="section-title">Koleksi Marker Tata Surya</h1>
        <p class="section-subtitle">Unduh atau tampilkan pola target marker berikut pada layar terpisah untuk memunculkan model 3D interaktif.</p>

        <!-- Grid ini akan diisi secara otomatis oleh JavaScript -->
        <div class="marker-grid" id="markerGrid"></div>

        <div class="cta-container">
            <a href="dashboard.html" class="btn-secondary">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard
            </a>
            <a href="camera.html" class="btn-camera">
                Buka Kamera AR <i class="fa-solid fa-camera"></i>
            </a>
        </div>
    </section>

    <!-- SCRIPT RENDERER AUTOMATIS -->
<script>
    // 1. Data Lengkap Objek Astronomi dengan Path Gambar assets/web/web_[nama].webp
    const markersData = [
        { id: "01", tag: "Bintang", title: "Matahari", desc: "Pusat sistem tata surya.", file: "web_sun.webp" },
        { id: "02", tag: "Planet", title: "Merkurius", desc: "Planet kebumian terkecil terdekat dari Matahari.", file: "web_mercury.webp" },
        { id: "03", tag: "Planet", title: "Venus", desc: "Planet terpanas dengan atmosfer CO2 tebal.", file: "web_venus.webp" },
        { id: "04", tag: "Planet", title: "Bumi", desc: "Dunia kehidupan dengan atmosfer dan laut cair.", file: "web_bumi.webp" },
        { id: "05", tag: "Planet", title: "Mars", desc: "Planet Merah berdebu besi oksida.", file: "web_mars.webp" },
        { id: "06", tag: "Raksasa Gas", title: "Jupiter", desc: "Planet terbesar dengan Bintik Merah Raksasa.", file: "web_jupiter.webp" },
        { id: "07", tag: "Raksasa Gas", title: "Saturnus", desc: "Ikonik dengan sistem cincin es dan debu tebal.", file: "web_saturnus.webp" },
        { id: "08", tag: "Raksasa Es", title: "Uranus", desc: "Planet es dingin dengan rotasi menyamping.", file: "web_uranus.webp" },
        { id: "09", tag: "Raksasa Es", title: "Neptunus", desc: "Planet biru terluar dengan angin supersonik.", file: "web_neptunus.webp" },
        { id: "10", tag: "Satelit", title: "Bulan", desc: "Satelit alami tunggal milik Bumi.", file: "web_bulan.webp" },
        { id: "11", tag: "Planet Kerdil", title: "Pluto", desc: "Planet kerdil terkenal di Sabuk Kuiper.", file: "web_pluto.webp" },
        { id: "12", tag: "Planet Kerdil", title: "Ceres", desc: "Planet kerdil terbesar di Sabuk Asteroid.", file: "web_ceres.webp" },
        { id: "13", tag: "Planet Kerdil", title: "Eris", desc: "Planet kerdil paling masif di Sabuk Kuiper.", file: "web_eris.webp" },
        { id: "14", tag: "Planet Kerdil", title: "Haumea", desc: "Planet kerdil berbentuk elips yang berotasi cepat.", file: "web_haumea.webp" },
        { id: "15", tag: "Planet Kerdil", title: "Makemake", desc: "Planet kerdil tertutup es metana cair.", file: "web_makemake.webp" },
        { id: "16", tag: "Satelit", title: "Europa", desc: "Satelit Jupiter dengan lautan es bawah tanah.", file: "web_europa.webp" },
        { id: "17", tag: "Satelit", title: "Enceladus", desc: "Satelit Saturnus dengan geyser es aktif.", file: "web_enceladus.webp" },
        { id: "18", tag: "Satelit", title: "Titan", desc: "Satelit Saturnus ber-atmosfer tebal & memiliki danau metana.", file: "web_titan.webp" },
        { id: "19", tag: "Satelit", title: "Phobos", desc: "Satelit berukuran kecil berbentuk kentang milik Mars.", file: "web_phobos.webp" },
        { id: "20", tag: "Satelit", title: "Triton", desc: "Satelit Neptunus yang berorbit mundur (retrograde).", file: "web_triton.webp" },
        { id: "21", tag: "Satelit", title: "Oberon", desc: "Satelit alami terbesar kedua milik Uranus.", file: "web_oberon.webp" },
        { id: "22", tag: "Eksoplanet", title: "55Cancrie", desc: "Eksoplanet batuan ultra-panas (Janssen).", file: "web_55cancrie.webp" },
        { id: "23", tag: "Benda Langit", title: "Asteroid", desc: "Batuan luar angkasa dari sisa pembentukan tata surya.", file: "web_asteroid.webp" },
        { id: "24", tag: "Benda Langit", title: "Komet", desc: "Bola es dan debu berorbit lonjong dengan ekor gas.", file: "web_comet.webp" },
        { id: "25", tag: "Galaksi", title: "Bima Sakti", desc: "Galaksi spiral tempat Tata Surya berada.", file: "web_bimasakti.webp" }
    ];

    // 2. Render Otomatis ke Grid
    function renderMarkers() {
        const gridContainer = document.getElementById("markerGrid");
        
        gridContainer.innerHTML = markersData.map(item => `
            <div class="marker-card">
                <div>
                    <div class="card-top">
                        <span class="marker-number">${item.id}</span>
                        <div class="card-tag">${item.tag}</div>
                    </div>
                    <div class="marker-preview">
                        <img src="assets/web/${item.file}" alt="Marker ${item.title}" onerror="this.src='https://via.placeholder.com/100?text=${item.title.toUpperCase()}'">
                    </div>
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-desc">${item.desc}</p>
                </div>
                <div class="card-footer">
                    <a href="assets/web/${item.file}" download class="btn-download">
                        <i class="fa-solid fa-download"></i> Unduh Marker
                    </a>
                </div>
            </div>
        `).join('');
    }

    document.addEventListener("DOMContentLoaded", renderMarkers);
</script>
</body>
</html>
