<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Jumlah Soal Kuis | AR Navigation</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* CSS VARIABLE DISAMAKAN PERSIS DENGAN DASHBOARD & QUIZ */
        :root {
            --bg-gradient: linear-gradient(135deg, #020510 0%, #080f26 50%, #010206 100%);
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: #a4b0be;
            --glow-cyan: #00d2d3;
            --glow-blue: #00a8ff;
            --accent-rose: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container Glassmorphism Utama */
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px 30px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* Header Title with Neon Gradient */
        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--glow-cyan), var(--glow-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 12px rgba(0, 168, 255, 0.4));
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        /* Grid Layout */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        /* Card Option Style */
        .option-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px 16px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .option-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--glow-blue);
        }

        .option-card:active {
            transform: scale(0.98);
        }

        .number {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(to right, var(--glow-cyan), var(--glow-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 8px rgba(0, 168, 255, 0.3));
        }

        .label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Card Khusus Tombol Kembali */
        .option-card.back-card {
            border-color: rgba(244, 63, 94, 0.2);
            background: rgba(244, 63, 94, 0.03);
        }

        .option-card.back-card:hover {
            border-color: var(--accent-rose);
            background: rgba(244, 63, 94, 0.08);
        }

        .option-card.back-card .icon {
            font-size: 2rem;
            color: var(--accent-rose);
            margin-bottom: 4px;
            filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.4));
        }

        .option-card.back-card .label {
            color: var(--accent-rose);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .options-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kuis Astronomi Galaksi</h1>
        <p class="subtitle">Pilih jumlah soal yang ingin Anda kerjakan:</p>

        <div class="options-grid">
            <!-- Pilihan 10 Soal -->
            <a href="jumlah/quiz10.html" class="option-card">
                <div class="number">10</div>
                <div class="label">Soal (Singkat)</div>
            </a>

            <!-- Pilihan 20 Soal -->
            <a href="jumlah/quiz20.html" class="option-card">
                <div class="number">20</div>
                <div class="label">Soal (Standar)</div>
            </a>

            <!-- Pilihan 30 Soal -->
            <a href="jumlah/quiz30.html" class="option-card">
                <div class="number">30</div>
                <div class="label">Soal (Sedang)</div>
            </a>

            <!-- Pilihan 40 Soal -->
            <a href="jumlah/quiz40.html" class="option-card">
                <div class="number">40</div>
                <div class="label">Soal (Lanjutan)</div>
            </a>

            <!-- Pilihan 50 Soal -->
            <a href="jumlah/quiz50.html" class="option-card">
                <div class="number">50</div>
                <div class="label">Soal (Lengkap)</div>
            </a>

            <!-- Kotak Tombol Kembali -->
            <a href="../quiz.html" class="option-card back-card">
                <div class="icon">⬅</div>
                <div class="label">Kembali ke Utama</div>
            </a>
        </div>
    </div>

</body>
</html>
